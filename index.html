<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpottArr Search</title>
<style>
:root{--bg:#f3f5f6;--card:#fff;--tx:#17212b;--mut:#66727f;--bd:#dde2e6;--ac:#0f766e;--on:#fff;--chip:#e6efee}
@media (prefers-color-scheme:dark){:root{--bg:#10161b;--card:#18212a;--tx:#e6ecf1;--mut:#92a0ad;--bd:#27333d;--ac:#5eead4;--on:#06201c;--chip:#1c2b30}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:28px 16px 64px}
h1{font:600 28px/1.2 ui-serif,Georgia,serif;margin:0 0 18px}
form{display:flex;gap:8px}
input[type=search]{flex:1;min-width:0;padding:12px 14px;font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px}
button,select{font:inherit;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;cursor:pointer}
form button{background:var(--ac);color:var(--on);border-color:var(--ac);padding:12px 20px;font-weight:600}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 8px}
.bar .grow{flex:1}
.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
#status{color:var(--mut);font-size:14px;min-height:21px}
.err{color:#c0392b}
article{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:8px;padding:14px 16px;margin-top:10px}
article h2{font:600 18px/1.35 ui-serif,Georgia,serif;margin:0 0 4px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--mut);font-size:13px}
.badge{background:var(--chip);color:var(--ac);padding:1px 8px;border-radius:99px;font-weight:600}
.desc{margin:8px 0 0;font-size:14px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;overflow-wrap:anywhere}
.desc.open{-webkit-line-clamp:unset;display:block}
.act{margin-top:10px}
.act a{display:inline-block;background:var(--ac);color:var(--on);text-decoration:none;font-weight:600;font-size:14px;padding:6px 14px;border-radius:8px}
</style>
</head>
<body>
<main>
<h1>Spottarr zoeken</h1>
<form id="f"><input id="q" type="search" placeholder="Zoek op titel, bijv. Dune 2024" autofocus required><button>Zoeken</button></form>
<div class="bar" id="bar" hidden>
  <span id="chips"></span><span class="grow"></span>
  <label>Sorteer <select id="sort"><option value="date">Nieuwste eerst</option><option value="size">Grootste eerst</option><option value="title">Titel A–Z</option></select></label>
</div>
<div id="status"></div>
<div id="list"></div>
</main>
<script>
const NS='http://www.newznab.com/DTD/2010/feeds/attributes/';
const CATS={1:'Console',2:'Film',3:'Audio',4:'PC',5:'TV',6:'XXX',7:'Boek',8:'Overig'};
const $=s=>document.querySelector(s);
let items=[],cat=null;

const catName=c=>CATS[Math.floor(c/1000)]||'Overig';
const fmtSize=b=>{if(!b)return'';const u=['B','KB','MB','GB','TB'];let i=0;while(b>=1024&&i<4){b/=1024;i++}return b.toFixed(i>1?1:0)+' '+u[i]};
const fmtDate=d=>d?new Date(d).toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'}):'';

function parse(it){
  const t=n=>(it.getElementsByTagName(n)[0]?.textContent||'').trim();
  const a={};
  for(const e of it.getElementsByTagName('newznab:attr')){
    const k=e.getAttribute('name');(a[k]=a[k]||[]).push(e.getAttribute('value'));
  }
  const cats=(a.category||[]).map(Number);
  return{
    title:t('title')||'(zonder titel)',
    desc:t('description').replace(/_{5,}/g,' · ').replace(/\s+/g,' ').trim(),
    guid:(a.guid||[])[0],
    size:Number((a.size||[])[0])||0,
    date:t('pubDate'),
    cats,
    main:cats.find(c=>c%1000===0)??cats[0]??8000,
    poster:(a.poster||[])[0],
    year:(a.year||[])[0]
  };
}

async function search(q){
  const st=$('#status');st.className='';st.textContent='Zoeken…';$('#list').replaceChildren();
  try{
    const r=await fetch('api?q='+encodeURIComponent(q));
    if(!r.ok)throw new Error('Spottarr antwoordde met status '+r.status);
    let txt=await r.text();
    if(!/xmlns:newznab/.test(txt))txt=txt.replace('<rss ','<rss xmlns:newznab="'+NS+'" ');
    const x=new DOMParser().parseFromString(txt,'application/xml');
    if(x.querySelector('parsererror'))throw new Error('Antwoord is geen geldige XML');
    if(x.documentElement.nodeName==='error')throw new Error(x.documentElement.getAttribute('description')||'Fout van Spottarr');
    items=[...x.getElementsByTagName('item')].map(parse);
    cat=null;render();
  }catch(e){st.className='err';st.textContent='Zoeken mislukt: '+e.message+'. Controleer of Spottarr draait en de API-key klopt.';$('#bar').hidden=true}
}

function render(){
  const list=$('#list'),st=$('#status');
  list.replaceChildren();
  $('#bar').hidden=!items.length;
  if(!items.length){st.textContent='Geen resultaten. Probeer minder of andere woorden.';return}
  const counts={};items.forEach(i=>{const n=catName(i.main);counts[n]=(counts[n]||0)+1});
  const chips=$('#chips');chips.replaceChildren();
  [['Alles',null],...Object.keys(counts).map(n=>[n+' ('+counts[n]+')',n])].forEach(([label,val])=>{
    const b=document.createElement('button');b.type='button';b.textContent=label;
    b.className='chip'+(cat===val?' on':'');b.style.marginRight='6px';
    b.onclick=()=>{cat=val;render()};chips.append(b);
  });
  const sort=$('#sort').value;
  const shown=items.filter(i=>!cat||catName(i.main)===cat).sort((a,b)=>
    sort==='size'?b.size-a.size:sort==='title'?a.title.localeCompare(b.title,'nl'):new Date(b.date)-new Date(a.date));
  st.textContent=shown.length+' resultaten';
  for(const i of shown){
    const el=document.createElement('article');
    const h=document.createElement('h2');h.textContent=i.title;
    const m=document.createElement('div');m.className='meta';
    const badge=document.createElement('span');badge.className='badge';badge.textContent=catName(i.main);
    m.append(badge);
    [fmtSize(i.size),fmtDate(i.date),i.year,i.poster&&'door '+i.poster].filter(Boolean).forEach(s=>{
      const sp=document.createElement('span');sp.textContent=s;m.append(sp)});
    el.append(h,m);
    if(i.desc){const d=document.createElement('p');d.className='desc';d.textContent=i.desc;d.title='Klik om uit te klappen';
      d.onclick=()=>d.classList.toggle('open');el.append(d)}
    if(i.guid){const w=document.createElement('div');w.className='act';
      const a=document.createElement('a');a.href='nzb?guid='+encodeURIComponent(i.guid);a.textContent='Download NZB';
      w.append(a);el.append(w)}
    list.append(el);
  }
}

$('#f').onsubmit=e=>{e.preventDefault();const q=$('#q').value.trim();if(q)search(q)};
$('#sort').onchange=render;
</script>
</body>
</html>
